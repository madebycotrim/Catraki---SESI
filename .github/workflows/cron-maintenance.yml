name: Scheduled Legal & LGPD Maintenance

on:
  schedule:
    - cron: '0 4 * * *' # Diariamente às 04:00 UTC (01:00 Brasília)
  workflow_dispatch:

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke /api/internal/cron (LGPD Art. 16 & Marco Civil Art. 15)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL ou CRON_SECRET não configurados nos Secrets do GitHub; o fallback oportunista no Edge continuará ativo."
            exit 0
          fi
          curl -fsS -X POST "${APP_URL%/}/api/internal/cron" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json"
